[package]
name = "hataori-tenferro"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "Hataori lanes over caller-held tenferro CPU engines"

[features]
mpi = ["hataori/mpi", "dep:mpi-upstream"]

[dependencies]
hataori = { path = "../..", features = ["rayon"] }
mpi-upstream = { package = "mpi", version = "=0.8.1", default-features = false, optional = true }
# Provider-neutral: the consumer selects tenferro-cpu's CPU provider (`native`,
# `blas`, `provider-inject`, ...) through its own dependency on tenferro-cpu;
# the providers are mutually exclusive, so the adapter must not pick one.
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs", rev = "5f0ae0a3e58b38ff45c25efff577a7d2a6a95b30", default-features = false }

[dev-dependencies]
# The adapter's own tests, doctests and examples run on the native provider.
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs", rev = "5f0ae0a3e58b38ff45c25efff577a7d2a6a95b30", default-features = false, features = ["native"] }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs", rev = "5f0ae0a3e58b38ff45c25efff577a7d2a6a95b30" }

[[example]]
name = "pmap_lanes_smoke"
required-features = ["mpi"]
