[package]
name = "hataori-tenferro"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "Hataori lanes over caller-held tenferro CPU engines"

[features]
mpi = ["hataori/mpi", "dep:mpi-upstream"]

[dependencies]
hataori = { path = "../..", features = ["rayon"] }
mpi-upstream = { package = "mpi", version = "=0.8.1", default-features = false, optional = true }
# tenferro-cpu has one CPU provider since tenferro-rs#2609 dropped the vendor
# BLAS/LAPACK providers, so there is no provider feature to select or forward.
tenferro-cpu = { git = "https://github.com/tensor4all/tenferro-rs", rev = "219170b2962cde9c9f58318f06e97766a2a4c578", default-features = false }

[dev-dependencies]
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs", rev = "219170b2962cde9c9f58318f06e97766a2a4c578" }

[[example]]
name = "pmap_lanes_smoke"
required-features = ["mpi"]
