[workspace]
members = ["adapters/tenferro", "crates/hataori-runtime-foundation", "crates/hataori-runtime", "crates/hataori-algorithms"]
default-members = ["."]
resolver = "2"

[package]
name = "hataori"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local data parallelism and an optional long-lived distributed runtime"

[features]
default = []
rayon = ["dep:rayon", "dep:libc"]
mpi = ["dep:mpi-upstream", "dep:serde", "dep:bincode"]
rsmpi-rt = ["dep:mpi-runtime", "dep:serde", "dep:bincode"]
bitcode = ["dep:bitcode"]
tenferro = ["dep:tenferro-tensor"]
runtime = ["dep:hataori-runtime", "dep:hataori-algorithms"]

[dependencies]
rayon = { version = "1.10", optional = true }
mpi-upstream = { package = "mpi", version = "=0.8.1", default-features = false, optional = true }
mpi-runtime = { package = "mpi", git = "https://github.com/tensor4all/rsmpi-rt", rev = "6db6a2d6f96115b17c9a925e53ce719797c15dbb", default-features = false, features = ["mpi-rt-sys-backend"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "2", default-features = false, features = ["serde", "std"], optional = true }
bitcode = { version = "0.6", default-features = false, features = ["serde", "std"], optional = true }
tenferro-tensor = { git = "https://github.com/tensor4all/tenferro-rs", rev = "2bd44458b819afe7eab2d71bbb97166c59fd4e1a", optional = true }
hataori-runtime = { path = "crates/hataori-runtime", optional = true }
hataori-algorithms = { path = "crates/hataori-algorithms", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "mpi_pmap_smoke"
required-features = ["mpi"]

[[example]]
name = "rsmpi_rt_pmap_smoke"
required-features = ["rsmpi-rt"]

[[example]]
name = "mpi_placement_smoke"
required-features = ["mpi"]

[[example]]
name = "mpi_pi_raw"
required-features = ["mpi"]

[[example]]
name = "mpi_pi_pmap"
required-features = ["mpi"]

[[example]]
name = "mpi_mandelbrot_raw"
required-features = ["mpi", "tenferro"]

[[example]]
name = "mpi_mandelbrot_pmap"
required-features = ["mpi", "tenferro"]

[[example]]
name = "mpi_mandelbrot_placement"
required-features = ["mpi", "tenferro"]

[[example]]
name = "serial_mandelbrot"
required-features = ["tenferro"]

[[example]]
name = "rsmpi_rt_placement_smoke"
required-features = ["rsmpi-rt"]

[[example]]
name = "rayon_mandelbrot"
required-features = ["rayon", "tenferro"]

[[example]]
name = "mpi_mandelbrot_hybrid"
required-features = ["mpi", "rayon", "tenferro"]

[[example]]
name = "rsmpi_rt_mandelbrot_pmap"
required-features = ["rsmpi-rt", "tenferro"]

[[example]]
name = "rsmpi_rt_mandelbrot_placement"
required-features = ["rsmpi-rt", "tenferro"]

[[example]]
name = "rsmpi_rt_mandelbrot_hybrid"
required-features = ["rsmpi-rt", "rayon", "tenferro"]

[profile.dev]
debug = 0

[profile.test]
debug = 0

# CI builds and tests with this profile (tensor4all-agent-rules, rules/common/repository.md,
# "Build Profiles"); `scripts/check-*.sh` and `ci.yml` pass `--profile ci`. It inherits `test`, not
# `release`: the wire and object framing state their length invariants as `debug_assert!`s
# (`src/wire.rs`, `crates/hataori-runtime/src/{wire,object,domain}.rs`,
# `crates/hataori-runtime-foundation/src/protocol.rs`), length and offset arithmetic on received
# frames should panic on overflow in a test instead of wrapping, and the standard library's
# unsafe-precondition checks only run with `debug-assertions`. `dev`/`test` above already set
# `debug = 0`, so this changes no code generation; it fixes the name every workflow uses.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
