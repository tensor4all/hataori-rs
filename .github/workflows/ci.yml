name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
  # Daily canary: `core` builds against the committed Cargo.lock, so registry
  # drift only shows up in the unlocked `deps-fresh` lane. The schedule runs
  # that lane once a day instead of waiting for a commit (issue 35).
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install MSRV and non-Linux check target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add x86_64-apple-darwin
      - name: Install MPIwrapper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev libopenmpi-dev openmpi-bin python3
      - name: Build pinned MPIwrapper fixture
        env:
          MPIWRAPPER_COMMIT: 966f4231c96153a08295fc7d0bcbd65e916a73fd
        run: |
          git clone https://github.com/eschnett/MPIwrapper.git "$RUNNER_TEMP/MPIwrapper"
          git -C "$RUNNER_TEMP/MPIwrapper" checkout --detach "$MPIWRAPPER_COMMIT"
          cmake -S "$RUNNER_TEMP/MPIwrapper" -B "$RUNNER_TEMP/MPIwrapper/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mpiwrapper-install"
          cmake --build "$RUNNER_TEMP/MPIwrapper/build" --parallel 2
          cmake --install "$RUNNER_TEMP/MPIwrapper/build"
      - name: Run complete core matrix
        run: |
          scripts/check-core.sh \
            "$RUNNER_TEMP/mpiwrapper-install/lib/libmpiwrapper.so" \
            966f4231c96153a08295fc7d0bcbd65e916a73fd
      - name: Check immutable legacy performance runner
        run: scripts/check-legacy-runner.sh
      - name: Check Phase A runtime foundation
        run: scripts/check-runtime-foundation.sh
      - name: Check Phase B runtime and structured execution
        run: scripts/check-phase-b-runtime.sh
      - name: Check Phase C fixed-placement remote objects
        run: scripts/check-phase-c-objects.sh
      - name: Check Phase D explicit object migration
        run: scripts/check-phase-d-migration.sh
      - name: Check Phase E algorithms and facade correctness
        run: scripts/check-phase-e-algorithms.sh

  deps-fresh:
    # Unlocked drift-detection lane, deliberately separate from `core`: it
    # resolves the newest compatible dependency set and tests it. It is not
    # continue-on-error, because a red result here is information — the
    # dependency train moved and the committed lock is stale.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MPI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev libopenmpi-dev openmpi-bin
      - name: Resolve the newest compatible dependency set
        run: cargo update
      - name: Test the freshly resolved dependency set
        run: |
          cargo test --no-default-features
          cargo test --no-default-features --features rayon
          cargo test --no-default-features --features mpi
          cargo test --no-default-features --features mpi,rayon

      - name: Check the feature boundaries still fail to compile
        run: scripts/check-compile-boundaries.sh

      - name: Install the MSRV toolchain the adapter script checks
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test the freshly resolved tenferro adapter tree
        run: scripts/check-tenferro.sh

  tenferro-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install core MSRV and MPI launcher
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin
      - name: Run tenferro engine lane adapter matrix
        run: scripts/check-tenferro.sh
